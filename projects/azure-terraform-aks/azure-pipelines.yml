trigger: none

pr: none

name: aks-terraform-$(Date:yyyyMMdd)$(Rev:.r)

variables:
  - name: terraformVersion
    value: '1.15.8'

  - name: workingDirectory
    value: 'projects/azure-terraform-aks/terraform'

  - name: serviceConnection
    value: 'giancucio3cscwif'

  - name: backendResourceGroupName
    value: 'giancucio-tfstate-rg'

  - name: backendStorageAccountName
    value: 'giancuciotfstatesa'

  - name: backendContainerName
    value: 'tfstate'

  - name: backendKey
    value: 'aks.tfstate'

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Plan
    displayName: Terraform Plan
    jobs:
      - job: Plan
        displayName: Terraform Plan
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(terraformVersion)

          - task: AzureCLI@2
            displayName: Terraform Init
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(workingDirectory)
              inlineScript: |
                terraform init \
                  -backend-config="resource_group_name=$(backendResourceGroupName)" \
                  -backend-config="storage_account_name=$(backendStorageAccountName)" \
                  -backend-config="container_name=$(backendContainerName)" \
                  -backend-config="key=$(backendKey)"

          - task: AzureCLI@2
            displayName: Terraform Fmt Check
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(workingDirectory)
              inlineScript: |
                terraform fmt -check -recursive

          - task: AzureCLI@2
            displayName: Terraform Validate
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(workingDirectory)
              inlineScript: |
                terraform validate

          - task: AzureCLI@2
            displayName: Terraform Plan
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(workingDirectory)
              inlineScript: |
                terraform plan -out=tfplan

          - task: PublishPipelineArtifact@1
            displayName: Publish tfplan
            inputs:
              targetPath: '$(workingDirectory)/tfplan'
              artifact: 'tfplan'
              publishLocation: 'pipeline'

  - stage: Apply
    displayName: Terraform Apply
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Apply
        displayName: Terraform Apply
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(terraformVersion)

          - task: DownloadPipelineArtifact@2
            displayName: Download tfplan
            inputs:
              artifact: 'tfplan'
              path: '$(workingDirectory)'

          - task: AzureCLI@2
            displayName: Terraform Init
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(workingDirectory)
              inlineScript: |
                terraform init \
                  -backend-config="resource_group_name=$(backendResourceGroupName)" \
                  -backend-config="storage_account_name=$(backendStorageAccountName)" \
                  -backend-config="container_name=$(backendContainerName)" \
                  -backend-config="key=$(backendKey)"

          - task: AzureCLI@2
            displayName: Terraform Apply
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(workingDirectory)
              inlineScript: |
                terraform apply -auto-approve tfplan
