parameters:
  - name: stateMigrationComplete
    displayName: Existing state has been migrated and reviewed
    type: boolean
    default: false

trigger: none

pr: none

name: aks-terraform-$(Date:yyyyMMdd)$(Rev:.r)

variables:
  - name: terraformVersion
    value: '1.15.8'

  - name: serviceConnection
    value: 'giancucio3cscwif'

  - name: backendResourceGroupName
    value: 'giancucio-tfstate-rg'

  - name: backendStorageAccountName
    value: 'giancuciotfstatesa'

  - name: backendContainerName
    value: 'tfstate'

  - name: tfvarsFile
    value: 'environments/dev.tfvars'

  - name: aksClusterName
    value: 'aks-dev-eastus'

  - name: aksResourceGroup
    value: 'rg-aks-dev-eastus'

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Foundation
    displayName: 01 Foundation
    condition: and(succeeded(), eq('${{ parameters.stateMigrationComplete }}', 'true'))
    variables:
      - name: stack
        value: 01_foundation
      - name: workingDirectory
        value: projects/azure-terraform-aks/terraform/01_foundation
      - name: backendKey
        value: aks-dev-01_foundation.tfstate
    jobs:
      - job: Plan
        steps:
          - template: projects/azure-terraform-aks/pipelines/terraform-plan-steps.yml
      - job: Approval
        dependsOn: Plan
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ''
              instructions: 'Review the 01_foundation Terraform plan artifact before approving apply.'
              onTimeout: reject
      - job: Apply
        dependsOn: Approval
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        steps:
          - template: projects/azure-terraform-aks/pipelines/terraform-apply-steps.yml

  - stage: Security
    displayName: 02 Security
    dependsOn: Foundation
    condition: and(succeeded(), eq('${{ parameters.stateMigrationComplete }}', 'true'))
    variables:
      - name: stack
        value: 02_security
      - name: workingDirectory
        value: projects/azure-terraform-aks/terraform/02_security
      - name: backendKey
        value: aks-dev-02_security.tfstate
    jobs:
      - job: Plan
        steps:
          - template: projects/azure-terraform-aks/pipelines/terraform-plan-steps.yml
      - job: Approval
        dependsOn: Plan
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ''
              instructions: 'Review the 02_security Terraform plan artifact before approving apply.'
              onTimeout: reject
      - job: Apply
        dependsOn: Approval
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        steps:
          - template: projects/azure-terraform-aks/pipelines/terraform-apply-steps.yml

  - stage: Network
    displayName: 03 Network
    dependsOn: Security
    condition: and(succeeded(), eq('${{ parameters.stateMigrationComplete }}', 'true'))
    variables:
      - name: stack
        value: 03_network
      - name: workingDirectory
        value: projects/azure-terraform-aks/terraform/03_network
      - name: backendKey
        value: aks-dev-03_network.tfstate
    jobs:
      - job: Plan
        steps:
          - template: projects/azure-terraform-aks/pipelines/terraform-plan-steps.yml
      - job: Approval
        dependsOn: Plan
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ''
              instructions: 'Review the 03_network Terraform plan artifact before approving apply.'
              onTimeout: reject
      - job: Apply
        dependsOn: Approval
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        steps:
          - template: projects/azure-terraform-aks/pipelines/terraform-apply-steps.yml

  - stage: Workload
    displayName: 04 Workload
    dependsOn: Network
    condition: and(succeeded(), eq('${{ parameters.stateMigrationComplete }}', 'true'))
    variables:
      - name: stack
        value: 04_workload
      - name: workingDirectory
        value: projects/azure-terraform-aks/terraform/04_workload
      - name: backendKey
        value: aks-dev-04_workload.tfstate
    jobs:
      - job: Plan
        steps:
          - template: projects/azure-terraform-aks/pipelines/terraform-plan-steps.yml
      - job: Approval
        dependsOn: Plan
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ''
              instructions: 'Review the 04_workload Terraform plan artifact before approving apply.'
              onTimeout: reject
      - job: Apply
        dependsOn: Approval
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        steps:
          - template: projects/azure-terraform-aks/pipelines/terraform-apply-steps.yml
      - job: Bootstrap
        displayName: Kubernetes Bootstrap
        dependsOn: Apply
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: Apply Namespaces
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group $(aksResourceGroup) \
                  --name $(aksClusterName) \
                  --overwrite-existing

                kubectl apply -f projects/azure-terraform-aks/k8s/namespaces/
                kubectl get namespaces -l managed-by=pipeline
