trigger:
  branches:
    include:
      - main

parameters:
  - name: runDeploy
    type: boolean
    default: false

variables:
  resourceGroupName: rg-portfolio-dev
  templateFile: main.bicep
  parameterFile: main.parameters.json

stages:
  - stage: Validate
    jobs:
      - job: Validate
        pool:
          vmImage: ubuntu-latest
        steps:
          - script: az bicep build --file $(templateFile)

  - stage: WhatIf
    dependsOn: Validate
    jobs:
      - job: WhatIf
        pool:
          vmImage: ubuntu-latest
        steps:
          - script: |
              az deployment group what-if \
                --resource-group $(resourceGroupName) \
                --template-file $(templateFile) \
                --parameters @$(parameterFile)

  - stage: Deploy
    dependsOn: WhatIf
    condition: and(succeeded(), eq('${{ parameters.runDeploy }}', true))
    jobs:
      - deployment: Deploy
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    az deployment group create \
                      --resource-group $(resourceGroupName) \
                      --template-file $(templateFile) \
                      --parameters @$(parameterFile)
