trigger:
  branches:
    include:
      - main

parameters:
  - name: runApply
    type: boolean
    default: false

variables:
  tfRoot: infra

stages:
  - stage: Validate
    jobs:
      - job: Validate
        pool:
          vmImage: ubuntu-latest
        steps:
          - script: |
              cd $(tfRoot)
              terraform init
              terraform fmt -check -recursive
              terraform validate

  - stage: Plan
    dependsOn: Validate
    jobs:
      - job: Plan
        pool:
          vmImage: ubuntu-latest
        steps:
          - script: |
              cd $(tfRoot)
              terraform init
              terraform plan -out=tfplan

  - stage: Apply
    dependsOn: Plan
    condition: and(succeeded(), eq('${{ parameters.runApply }}', true))
    jobs:
      - deployment: Apply
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    cd $(tfRoot)
                    terraform apply -auto-approve tfplan
