name: AKS Terraform

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Terraform stage to run
        required: true
        type: choice
        options:
          - 01_foundation
          - 02_security
          - 03_network
          - 04_workload
      operation:
        description: Terraform operation
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
      state_migration_complete:
        description: Confirm existing state has been migrated and reviewed before apply
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: aks-terraform-${{ inputs.stage }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.15.8
  TF_WORKING_DIRECTORY: projects/azure-terraform-aks/terraform/${{ inputs.stage }}
  TF_BACKEND_RESOURCE_GROUP: giancucio-tfstate-rg
  TF_BACKEND_STORAGE_ACCOUNT: giancuciotfstatesa
  TF_BACKEND_CONTAINER: tfstate
  TF_BACKEND_KEY: aks-dev-${{ inputs.stage }}.tfstate
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  plan:
    name: ${{ inputs.stage }} plan
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true
    outputs:
      plan_artifact: ${{ steps.plan_artifact.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${TF_BACKEND_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_BACKEND_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_BACKEND_CONTAINER}" \
            -backend-config="key=${TF_BACKEND_KEY}" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_cli=true"

      - name: Terraform format check
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform plan \
            -var-file="../terraform.tfvars" \
            -var-file="environments/dev.tfvars" \
            -out=tfplan

      - name: Publish Terraform plan
        id: plan_artifact
        uses: actions/upload-artifact@v4
        with:
          name: aks-${{ inputs.stage }}-tfplan-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIRECTORY }}/tfplan
          if-no-files-found: error
          retention-days: 7

  apply:
    name: ${{ inputs.stage }} apply
    needs: plan
    if: ${{ inputs.operation == 'apply' && inputs.state_migration_complete == true }}
    runs-on: ubuntu-latest
    environment: aks-apply
    env:
      TF_IN_AUTOMATION: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: aks-${{ inputs.stage }}-tfplan-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIRECTORY }}

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${TF_BACKEND_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_BACKEND_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_BACKEND_CONTAINER}" \
            -backend-config="key=${TF_BACKEND_KEY}" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_cli=true"

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: terraform apply -auto-approve tfplan

  bootstrap:
    name: Kubernetes namespace bootstrap
    needs: apply
    if: ${{ inputs.operation == 'apply' && inputs.stage == '04_workload' && inputs.state_migration_complete == true }}
    runs-on: ubuntu-latest
    environment: aks-apply
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg-aks-dev-eastus \
            --name aks-dev-eastus \
            --overwrite-existing

      - name: Apply namespace manifests
        run: |
          kubectl apply -f projects/azure-terraform-aks/k8s/namespaces/
          kubectl get namespaces -l managed-by=pipeline
