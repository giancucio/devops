name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Terraform fmt check
        run: |
          if command -v terraform >/dev/null 2>&1; then
            find . -name "*.tf" -print0 | xargs -0 -n1 dirname | sort -u | xargs -I{} sh -c 'terraform -chdir={} fmt -check || true'
          else
            echo "terraform not installed, skipping"
          fi
      - name: ShellCheck for scripts
        uses: reviewdog/action-shellcheck@v1
        with:
          reporter: github-pr-review
          filter_mode: file

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown
        uses: markdownlint/markdownlint-action@v1
